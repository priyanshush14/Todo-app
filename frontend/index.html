<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sluglist</title>

    <!-- Sluglist favicon -->
    <link rel="icon" type="image/png" href="sluglist-logo-bw.png">

    <link rel="stylesheet" href="style.css">

    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch (e) {}
        })();
    </script>
</head>

<body>

    <div class="auth-card signup-mode">

        <!-- Theme Controls -->
        <div class="theme-switch auth-theme-switch" role="group" aria-label="Theme mode">
            <button
                type="button"
                id="themeLightBtn"
                class="theme-btn active"
                data-theme="light"
                title="Light mode"
            >
                <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" stroke-linecap="round"/>
                </svg>
                <span>Light</span>
            </button>

            <button
                type="button"
                id="themeDarkBtn"
                class="theme-btn"
                data-theme="dark"
                title="Dark mode"
            >
                <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Dark</span>
            </button>
        </div>

        <!-- Login / Signup tabs -->
        <div class="auth-tabs">

            <!-- Login -->
            <button id="loginTab" class="tab-button">

                <svg class="tab-icon" viewBox="0 0 24 24" fill="none">

                    <path
                        d="M10 5H5C4.45 5 4 5.45 4 6V18C4 18.55 4.45 19 5 19H10"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />

                    <path
                        d="M11 12H20"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />

                    <path
                        d="M17 9L20 12L17 15"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

                Login

            </button>


            <!-- Sign Up -->
            <button id="signupTab" class="tab-button active">

                <svg class="tab-icon" viewBox="0 0 24 24" fill="none">

                    <circle
                        cx="9"
                        cy="8"
                        r="3.5"
                        stroke="currentColor"
                        stroke-width="1.8"
                    />

                    <path
                        d="M3.5 20C3.5 16.7 5.8 14.5 9 14.5C12.2 14.5 14.5 16.7 14.5 20"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />

                    <path
                        d="M18 8V14"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />

                    <path
                        d="M15 11H21"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />

                </svg>

                Sign Up

            </button>

        </div>


        <!-- ========================= -->
        <!-- SIGN UP PAGE -->
        <!-- ========================= -->

        <div id="signupPage" class="auth-page">

            <div class="signup-layout">

                <div class="signup-form-col">

                    <div class="form-group">

                        <label for="signupName">
                            Name
                        </label>

                        <input
                            type="text"
                            id="signupName"
                            placeholder="Enter your name"
                        >

                    </div>


                    <div class="form-group">

                        <label for="signupUsername">
                            Username
                        </label>

                        <input
                            type="text"
                            id="signupUsername"
                            placeholder="Enter your username"
                        >

                    </div>


                    <div class="form-group">

                        <label for="signupPassword">
                            Password
                        </label>

                        <div class="password-input-wrapper">

                            <input
                                type="password"
                                id="signupPassword"
                                placeholder="Enter your password"
                            >

                            <button
                                type="button"
                                id="signupPasswordToggle"
                                class="password-toggle-btn"
                                aria-label="Show password"
                                title="Show password"
                            >
                                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>

                        </div>

                    </div>


                    <button
                        id="signupButton"
                        class="main-button"
                    >
                        Create an account
                    </button>


                    <p
                        id="signupMessage"
                        class="message"
                    ></p>


                    <div class="bottom-text">

                        Already have an account?

                        <button id="goToLogin">
                            Login
                        </button>

                    </div>

                </div>


                <!-- Signup Requirements Panel (Positioned on the Right Side) -->
                <aside class="signup-requirements" aria-label="Sign up requirements">

                    <div class="requirements-header">
                        <svg class="req-header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="16" x2="12" y2="12"/>
                            <line x1="12" y1="8" x2="12.01" y2="8"/>
                        </svg>
                        <span>Sign up requirements</span>
                    </div>

                    <div class="req-group">
                        <span class="req-group-title">Name</span>
                        <ul class="req-list">
                            <li id="reqNameMin" class="req-item">
                                <svg class="req-icon req-icon-unmet" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
                                    <circle cx="8" cy="8" r="6"/>
                                </svg>
                                <svg class="req-icon req-icon-met" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3.5 8.5 6.5 11.5 12.5 5.5"/>
                                </svg>
                                <span>At least 3 characters</span>
                            </li>
                        </ul>
                    </div>

                    <div class="req-group">
                        <span class="req-group-title">Username</span>
                        <ul class="req-list">
                            <li id="reqUsernameLength" class="req-item">
                                <svg class="req-icon req-icon-unmet" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
                                    <circle cx="8" cy="8" r="6"/>
                                </svg>
                                <svg class="req-icon req-icon-met" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3.5 8.5 6.5 11.5 12.5 5.5"/>
                                </svg>
                                <span>6–12 characters</span>
                            </li>
                        </ul>
                    </div>

                    <div class="req-group">
                        <span class="req-group-title">Password</span>
                        <ul class="req-list">
                            <li id="reqPasswordLength" class="req-item">
                                <svg class="req-icon req-icon-unmet" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
                                    <circle cx="8" cy="8" r="6"/>
                                </svg>
                                <svg class="req-icon req-icon-met" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3.5 8.5 6.5 11.5 12.5 5.5"/>
                                </svg>
                                <span>8–20 characters</span>
                            </li>
                            <li id="reqPasswordUpper" class="req-item">
                                <svg class="req-icon req-icon-unmet" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
                                    <circle cx="8" cy="8" r="6"/>
                                </svg>
                                <svg class="req-icon req-icon-met" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3.5 8.5 6.5 11.5 12.5 5.5"/>
                                </svg>
                                <span>At least one uppercase letter (A–Z)</span>
                            </li>
                            <li id="reqPasswordSpecial" class="req-item">
                                <svg class="req-icon req-icon-unmet" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
                                    <circle cx="8" cy="8" r="6"/>
                                </svg>
                                <svg class="req-icon req-icon-met" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3.5 8.5 6.5 11.5 12.5 5.5"/>
                                </svg>
                                <span>At least one special character</span>
                            </li>
                        </ul>
                    </div>

                </aside>

            </div>

        </div>


        <!-- ========================= -->
        <!-- LOGIN PAGE -->
        <!-- ========================= -->

        <div
            id="loginPage"
            class="auth-page hidden"
        >

            <div class="form-group">

                <label for="loginUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Enter your username"
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <div class="password-input-wrapper">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                    >

                    <button
                        type="button"
                        id="loginPasswordToggle"
                        class="password-toggle-btn"
                        aria-label="Show password"
                        title="Show password"
                    >
                        <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>

                </div>

            </div>


            <button
                id="loginButton"
                class="main-button"
            >
                Log In
            </button>


            <p
                id="loginMessage"
                class="message"
            ></p>


            <div class="bottom-text">

                Don't have an account?

                <button id="goToSignup">
                    Sign up
                </button>

            </div>

        </div>

    </div>
    <script src="app.js"></script>

</body>

</html>
